<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تقييم الرحلة 🌍</title>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.2/confetti.browser.min.js"></script>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
  background: linear-gradient(135deg, #24304d 0%, #3a4d6e 50%, #3f6a72 100%);
  background-attachment: fixed;
  min-height: 100vh;
  padding: 24px 12px 60px;
  direction: rtl;
  color: #1b1b2f;
}
#app { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.card {
  background: rgba(255,255,255,0.97);
  border-radius: 20px;
  padding: 24px 20px;
  box-shadow: 0 16px 40px rgba(0,0,0,0.28);
  animation: fadeIn .4s ease;
}
@keyframes fadeIn { from { opacity:0; transform: translateY(10px);} to {opacity:1; transform:none;} }
h1 { text-align:center; font-size: 28px; margin: 4px 0 22px; color:#fff; text-shadow: 0 2px 14px rgba(0,0,0,.35);
  animation: pulseTitle 2.4s ease-in-out infinite; }
@keyframes pulseTitle { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
h2 { margin: 0 0 6px; font-size: 20px; }
h3.results-sub { margin: 18px 0 8px; font-size: 14px; color:#666; font-weight:800; }
.sub { color:#666; margin: 0 0 16px; font-size: 14px; }

.tile { position: relative; border-radius: 18px; overflow: hidden; isolation: isolate; animation: fadeIn .4s ease; }
.tile::before {
  content: ''; position: absolute; inset: -60%; z-index: 0;
  background: conic-gradient(from 0deg, #6a74e0, #c76fd1, #6a74e0);
  animation: spinBorder 3.4s linear infinite;
}
.result-tile::before {
  background: conic-gradient(from 0deg, #4fbfae, #5b8fd6, #4fbfae);
}
.tile-reset::before { animation: none !important; }
@keyframes spinBorder { to { transform: rotate(360deg); } }
.tile .tile-inner {
  position: relative; z-index: 1; margin: 3px; border-radius: 16px;
  background: #fff; height: calc(100% - 6px);
}

.name-grid { display:grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
.name-tile .tile-inner { padding: 0; }
.name-btn {
  display:block; width:100%; height:100%; padding: 16px 10px; border-radius: 16px; border: none; cursor: pointer;
  font-size: 16px; font-weight: 700; color: #1b1b2f; background: #fff;
  transition: transform .15s ease;
}
.name-btn:hover { transform: translateY(-3px) scale(1.03); }

.code-box { text-align:center; }
.code-input {
  width: 160px; margin: 14px auto 8px; display:block; text-align:center; font-size: 26px;
  letter-spacing: 8px; padding: 10px; border-radius: 12px; border: 2px solid #ddd; font-weight:800;
}
.code-input:focus { border-color: #5b6ee1; outline:none; }

.rate-row { margin-bottom: 24px; padding-bottom: 18px; border-bottom: 1px dashed #e2e2ee; }
.rate-row:last-of-type { border-bottom: none; }
.rate-row label { display:block; font-weight: 700; margin-bottom: 12px; font-size: 16px; }
.slider-wrap { display:flex; align-items:center; gap:12px; }
.rate-slider { flex: 1; -webkit-appearance:none; height: 10px; border-radius: 999px; outline:none; cursor:pointer; }
.rate-slider::-webkit-slider-thumb {
  -webkit-appearance:none; width: 26px; height: 26px; border-radius:50%;
  background: #fff; border: 4px solid #5b6ee1; cursor:pointer;
  box-shadow: 0 2px 8px rgba(0,0,0,.3);
}
.rate-slider::-moz-range-thumb {
  width: 26px; height: 26px; border-radius:50%;
  background: #fff; border: 4px solid #5b6ee1; cursor:pointer;
}
.rate-value {
  min-width: 52px; text-align:center; font-size: 18px; font-weight: 800; color:#fff;
  background: linear-gradient(135deg,#5b6ee1,#4fbfae); border-radius: 12px; padding: 6px 4px;
  transition: background .2s ease;
}
.range-caption { display:flex; justify-content:space-between; font-size:11px; color:#999; margin-top:4px; }

.feedback-row { display:flex; flex-direction:column; gap:8px; margin-top:12px; }
.text-input {
  width:100%; padding:10px 12px; border-radius:10px; border:2px solid #e2e2ee;
  font-size:14px; font-family:inherit; color:#1b1b2f; resize:vertical;
}
.text-input:focus { border-color:#5b6ee1; outline:none; }
.extra-field { margin-bottom:20px; }
.extra-field label { display:block; font-weight:700; margin-bottom:8px; font-size:15px; }
.game-picker { display:flex; flex-wrap:wrap; gap:8px; margin-top:4px; }
.game-btn {
  padding:10px 16px; border-radius:999px; border:2px solid #e2e2ee; background:#fff;
  font-weight:700; font-size:14px; cursor:pointer; color:#1b1b2f;
}
.game-btn.selected { background: linear-gradient(135deg,#5b6ee1,#4fbfae); color:#fff; border-color:transparent; }

.submit-btn, .link-btn {
  display:block; width:100%; margin-top: 8px; padding: 15px; border-radius: 14px;
  border:none; font-size:16px; font-weight:700; cursor:pointer;
}
.submit-btn { background: linear-gradient(135deg,#e0916f,#e8ac6f); color:#fff; box-shadow: 0 6px 18px rgba(224,145,111,.35);
  transition: transform .15s ease; }
.submit-btn:active { transform: scale(.97); }
.submit-btn:disabled { opacity:.5; cursor:not-allowed; }
.link-btn { background: transparent; color:#5b6ee1; text-decoration: underline; font-weight:600; margin-top:14px;}
.back-btn { background: transparent; color:#888; border:none; font-size:14px; cursor:pointer; margin-top:10px; text-decoration:underline; }

.results h2 { text-align:center; margin-bottom: 16px; }
.result-grid { display:flex; flex-direction:column; gap:14px; }
.result-tile .tile-inner { padding: 14px 16px; }
.result-item .rlabel { font-weight:800; font-size:15px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center;}
.avg-badge { background: linear-gradient(135deg,#4fbfae,#5b6ee1); color:#fff; padding:4px 12px; border-radius: 999px; font-size:14px; font-weight:800; }
.chips { display:flex; flex-wrap:wrap; gap:6px; }
.chip { background:#f1f1f8; border-radius:999px; padding:4px 10px; font-size:13px; color:#444; font-weight:700; }
.empty { color:#999; font-size:13px; }
.live-dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#00c9a7; margin-left:6px;
  animation: livePulse 1.4s ease-in-out infinite; vertical-align:middle; }
@keyframes livePulse { 0%,100%{opacity:1;} 50%{opacity:.3;} }
.fb-note { font-size:12.5px; color:#555; background:#f6f6fb; border-radius:8px; padding:6px 8px; margin:-2px 0 6px; }

.toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background:#1b1b2f; color:#fff; padding: 12px 22px; border-radius: 12px; font-size:14px;
  box-shadow: 0 8px 20px rgba(0,0,0,.35); z-index: 999; opacity:0; transition: opacity .3s ease;
}
.toast.show { opacity:1; }
.footer-note { text-align:center; color: rgba(255,255,255,.85); font-size:12px; margin-top: -6px; }
.name-tile:nth-child(1){animation-delay:.02s}.name-tile:nth-child(2){animation-delay:.06s}
.name-tile:nth-child(3){animation-delay:.10s}.name-tile:nth-child(4){animation-delay:.14s}
.name-tile:nth-child(5){animation-delay:.18s}.name-tile:nth-child(6){animation-delay:.22s}
.name-tile:nth-child(7){animation-delay:.26s}

.signin-card { text-align:center; }
.google-btn {
  display:flex; align-items:center; justify-content:center; gap:10px;
  width:100%; margin-top:16px; padding:14px; border-radius: 14px; border: 2px solid #e2e2ee;
  background:#fff; font-size:16px; font-weight:700; color:#1b1b2f; cursor:pointer;
}
.google-btn:hover { border-color:#5b6ee1; }
.google-btn img { width:20px; height:20px; }
.admin-tag {
  display:inline-block; margin-right:8px; background: linear-gradient(135deg,#e0916f,#e8ac6f);
  color:#fff; font-size:11px; font-weight:800; padding:2px 8px; border-radius:999px;
}
.admin-row { display:flex; justify-content:space-between; align-items:center; gap:8px;
  background:#f6f6fb; border-radius:10px; padding:6px 10px; font-size:12.5px; margin-bottom:6px; }
.admin-row .em { color:#444; font-weight:600; direction:ltr; text-align:left; overflow-wrap:anywhere; }
.admin-row .val { font-weight:800; color:#5b6ee1; white-space:nowrap; }
.error-text { color:#c0392b; font-size:13px; margin-top:8px; text-align:center; }
.thankyou { text-align:center; }
.thankyou .big-emoji { font-size:54px; }
</style>

</head>
<body>
<div id="app"><div class="card"><h2>جاري التحميل... ⏳</h2></div></div>

<script>
/* ================== إعداد Firebase ================== */
const firebaseConfig = {
  apiKey: "AIzaSyD6Fwq65m3ZR5hW8s3YlYZi1T6R4X7RqFQ",
  authDomain: "rehla-801a7.firebaseapp.com",
  projectId: "rehla-801a7",
  storageBucket: "rehla-801a7.firebasestorage.app",
  messagingSenderId: "257299738214",
  appId: "1:257299738214:web:a2944fd17549c8d15187a7",
  measurementId: "G-2BSD2LGNHY"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(err => console.error('persistence error', err));
const db = firebase.firestore();
const docRef = db.collection('tripRating').doc('state');
const claimsRef = db.collection('nameClaims');
const googleProvider = new firebase.auth.GoogleAuthProvider();
googleProvider.setCustomParameters({ prompt: 'select_account' });

/* البريد الذي يرى النتائج الكاملة (المشرف فقط) */
const ADMIN_EMAIL = 'mohammed.moutasem2011@gmail.com';

/* ================== بيانات الأصدقاء ================== */
const PEOPLE = ["محمد", "اسامة", "وسيم", "حمزة", "عبدالله", "اسيد", "زياد"];
const ALL_CATEGORIES = [
  { key: 'trip', label: 'تقييم الرحلة عموماً 🌍' },
  { key: 'guide', label: 'تقييم المرشد السياحي 🧭' }
].concat(PEOPLE.map(p => ({ key: p, label: p })));

/* الأماكن التي تمت زيارتها */
const PLACES = [
  { key: 'lakes7', label: 'البحيرات السبع - مشقيتا' },
  { key: 'burj_islam', label: 'برج إسلام' },
  { key: 'saleeb_turkman', label: 'صليب التركمان' },
  { key: 'wadi_qandil', label: 'وادي قنديل' },
  { key: 'blue_beach', label: 'الشاطئ الأزرق - اللاذقية' },
  { key: 'um_altuyour', label: 'أم الطيور' },
  { key: 'ras_albasit', label: 'رأس البسيط' },
  { key: 'badrusiyeh', label: 'البدروسية' },
  { key: 'samra', label: 'السمرة' }
];

/* الألعاب التي لُعبت */
const GAMES = ['مافيا', 'برا السالفة', 'تركس', 'طابة'];

/* الفئات التي تحتوي على حقول "أفضل/أسوأ شيء": الرحلة العامة وكل شخص (وليس المرشد) */
function hasFeedback(key) { return key === 'trip' || key === 'guide' || PEOPLE.indexOf(key) !== -1; }
function feedbackNoun(key) {
  if (key === 'trip') return 'الرحلة';
  if (key === 'guide') return 'المرشد السياحي';
  return key;
}

/* كلمات تساعد على استخراج اسم الشخص تلقائياً من اسمه في حساب Google
   (لاتينية أو عربية) بدون أن يختاره يدوياً في كل مرة */
const NAME_ALIASES = {
  'محمد': ['moham', 'muham', 'mohd'],
  'اسامة': ['osama', 'usama', 'ossama'],
  'وسيم': ['waseem', 'wasim', 'wassim'],
  'حمزة': ['hamza', 'hamzah'],
  'عبدالله': ['abdullah', 'abdallah', 'abdalla', 'abdulla'],
  'اسيد': ['aseed', 'asaid', 'assaid', 'aseid'],
  'زياد': ['ziad', 'ziyad', 'zeyad']
};

function detectNameFromGoogleAccount(user) {
  const dn = (user.displayName || '').toLowerCase();
  const em = (user.email || '').toLowerCase();
  for (const person of PEOPLE) {
    if (dn.includes(person) || em.includes(person)) return person;
  }
  for (const person of PEOPLE) {
    const aliases = NAME_ALIASES[person] || [];
    for (const alias of aliases) {
      if (dn.includes(alias) || em.includes(alias)) return person;
    }
  }
  return null;
}

/* ================== حالة عامة ================== */
let currentState = { votes: {}, feedback: {}, placeVotes: {}, extras: {} };
let claimsByName = {};   // { "محمد": {uid, email} }
let claimsByUid = {};    // { uid: "محمد" }
let myName = null;
let currentUser = null;
let gotVotes = false;
let gotClaims = false;
const app = document.getElementById('app');

/* ================== أدوات مساعدة ================== */
function fmt(n) { return (Math.round(n * 10) / 10).toString().replace(/\.0$/, ''); }
function unflatten(flat) {
  const result = {};
  Object.keys(flat).forEach(path => {
    const parts = path.split('.');
    let cur = result;
    for (let i = 0; i < parts.length - 1; i++) {
      if (!cur[parts[i]]) cur[parts[i]] = {};
      cur = cur[parts[i]];
    }
    cur[parts[parts.length - 1]] = flat[path];
  });
  return result;
}
async function saveUpdate(update) {
  try {
    await docRef.update(update);
  } catch (e) {
    if (e && e.code === 'not-found') {
      await docRef.set(unflatten(update), { merge: true });
    } else {
      throw e;
    }
  }
}
function escapeHtml(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escapeAttr(s) { return escapeHtml(s).replace(/"/g,'&quot;'); }
function sliderColor(v) {
  const pct = v / 5;
  const r = Math.round(255 - pct * 155);
  const g = Math.round(90 + pct * 150);
  const b = Math.round(120 + pct * 20);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}
function showToast(msg) {
  let t = document.getElementById('toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; document.body.appendChild(t); }
  t.textContent = msg;
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => t.classList.remove('show'), 2400);
}
function fireConfetti() {
  if (typeof confetti === 'function') {
    confetti({ particleCount: 140, spread: 90, origin: { y: 0.6 }, colors: ['#6a74e0', '#4fbfae', '#c76fd1', '#5b8fd6'] });
    setTimeout(() => confetti({ particleCount: 80, spread: 120, origin: { y: 0.4 }, angle: 60 }), 250);
    setTimeout(() => confetti({ particleCount: 80, spread: 120, origin: { y: 0.4 }, angle: 120 }), 400);
  }
}
/* يجبر المتصفح على إعادة رسم حركة الحد المتحرك فور ظهور البطاقات حتى لا تبقى ثابتة/مختفية */
function kickTileAnimations() {
  const tiles = document.querySelectorAll('.tile');
  tiles.forEach(t => t.classList.add('tile-reset'));
  void document.body.offsetHeight;
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      tiles.forEach(t => t.classList.remove('tile-reset'));
    });
  });
}

/* ================== النتائج (للمشرف فقط) ================== */
function renderCategoryResults(state) {
  return ALL_CATEGORIES.map(c => {
    const raw = (state.votes && state.votes[c.key]) || {};
    const fbRaw = (state.feedback && state.feedback[c.key]) || {};
    const entries = Object.keys(raw).map(uid => {
      const nm = claimsByUid[uid];
      const claim = nm && claimsByName[nm];
      const fb = fbRaw[uid] || {};
      return { value: raw[uid], email: (claim && claim.email) || 'غير معروف', best: fb.best || '', worst: fb.worst || '' };
    });
    const vals = entries.map(e => e.value);
    const avg = vals.length ? fmt(vals.reduce((a, b) => a + b, 0) / vals.length) : null;
    const body = entries.length
      ? entries.map(e =>
          '<div class="admin-row"><span class="em">' + escapeHtml(e.email) + '</span><span class="val">' + fmt(e.value) + '</span></div>' +
          ((e.best || e.worst) ? '<div class="fb-note">' + (e.best ? '✅ ' + escapeHtml(e.best) + '&nbsp; ' : '') + (e.worst ? '❌ ' + escapeHtml(e.worst) : '') + '</div>' : '')
        ).join('')
      : '<div class="empty">لا توجد تقييمات بعد</div>';
    return (
      '<div class="tile result-tile"><div class="tile-inner">' +
      '<div class="result-item">' +
        '<div class="rlabel"><span>' + c.label + '</span>' +
        (avg !== null ? '<span class="avg-badge">المتوسط ' + avg + '</span>' : '') +
        '</div>' + body +
      '</div></div></div>'
    );
  }).join('');
}
function renderPlaceResults(state) {
  return PLACES.map(p => {
    const raw = (state.placeVotes && state.placeVotes[p.key]) || {};
    const entries = Object.keys(raw).map(uid => {
      const nm = claimsByUid[uid];
      const claim = nm && claimsByName[nm];
      return { value: raw[uid], email: (claim && claim.email) || 'غير معروف' };
    });
    const vals = entries.map(e => e.value);
    const avg = vals.length ? fmt(vals.reduce((a, b) => a + b, 0) / vals.length) : null;
    const body = entries.length
      ? entries.map(e => '<div class="admin-row"><span class="em">' + escapeHtml(e.email) + '</span><span class="val">' + fmt(e.value) + '</span></div>').join('')
      : '<div class="empty">لا توجد تقييمات بعد</div>';
    return (
      '<div class="tile result-tile"><div class="tile-inner">' +
      '<div class="result-item">' +
        '<div class="rlabel"><span>' + p.label + '</span>' +
        (avg !== null ? '<span class="avg-badge">المتوسط ' + avg + '</span>' : '') +
        '</div>' + body +
      '</div></div></div>'
    );
  }).join('');
}
function renderExtrasResults(state) {
  const extras = state.extras || {};
  const uids = Object.keys(extras);
  if (!uids.length) return '<div class="empty">لا توجد إجابات بعد</div>';
  return uids.map(uid => {
    const nm = claimsByUid[uid];
    const claim = nm && claimsByName[nm];
    const email = (claim && claim.email) || 'غير معروف';
    const ex = extras[uid] || {};
    return (
      '<div class="tile result-tile"><div class="tile-inner">' +
      '<div class="result-item">' +
        '<div class="rlabel"><span>' + escapeHtml(email) + '</span></div>' +
        '<div class="fb-note">🏆 أفضل مكان: ' + escapeHtml(ex.bestPlace || '-') + '</div>' +
        '<div class="fb-note">👎 أسوأ مكان: ' + escapeHtml(ex.worstPlace || '-') + '</div>' +
        '<div class="fb-note">🎲 أفضل لعبة: ' + escapeHtml(ex.bestGame || '-') + '</div>' +
        '<div class="fb-note">🎲 أسوأ لعبة: ' + escapeHtml(ex.worstGame || '-') + '</div>' +
        '<div class="fb-note">💡 اقتراح للإضافة: ' + escapeHtml(ex.wish || '-') + '</div>' +
        '<div class="fb-note">📝 ملاحظات: ' + escapeHtml(ex.notes || '-') + '</div>' +
      '</div></div></div>'
    );
  }).join('');
}
function renderAllResultsHTML(state) {
  return (
    '<h3 class="results-sub">التقييمات</h3>' + renderCategoryResults(state) +
    '<h3 class="results-sub">الأماكن</h3>' + renderPlaceResults(state) +
    '<h3 class="results-sub">إجابات إضافية</h3>' + renderExtrasResults(state)
  );
}
function refreshResultsContainer() {
  const el = document.getElementById('resultsContainer');
  if (el) { el.innerHTML = renderAllResultsHTML(currentState); kickTileAnimations(); }
}
function resultsCardHTML() {
  const isAdmin = currentUser && currentUser.email === ADMIN_EMAIL;
  if (!isAdmin) return '';
  return '<div class="card results"><h2><span class="live-dot"></span> النتائج (خاص بالمشرف) 📊' +
    ' <span class="admin-tag">Admin</span></h2>' +
    '<div id="resultsContainer">' + renderAllResultsHTML(currentState) + '</div></div>';
}

/* ================== شاشة تسجيل الدخول ================== */
function renderSignIn(errorMsg) {
  app.innerHTML =
    '<h1>تقييم الرحلة 🎉</h1>' +
    '<div class="card signin-card">' +
      '<h2>أهلاً بك 👋</h2>' +
      '<p class="sub">سجّل الدخول بحساب Google الخاص بك لتتمكن من التقييم. حسابك يؤكد هويتك تلقائياً فلا يمكنك التصويت على نفسك.</p>' +
      '<button id="googleBtn" class="google-btn">' +
        '<img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" alt="">' +
        'تسجيل الدخول بحساب Google' +
      '</button>' +
      (errorMsg ? '<div class="error-text">' + errorMsg + '</div>' : '') +
    '</div>';
  const btn = document.getElementById('googleBtn');
  btn.addEventListener('click', () => {
    btn.disabled = true;
    btn.textContent = 'جاري تسجيل الدخول...';
    auth.signInWithPopup(googleProvider).catch(err => {
      console.error(err);
      btn.disabled = false;
      btn.textContent = 'تسجيل الدخول بحساب Google';
      if (err && err.code === 'auth/popup-blocked') {
        auth.signInWithRedirect(googleProvider).catch(err2 => {
          console.error(err2);
          renderSignIn('تعذر تسجيل الدخول: ' + (err2 && err2.code ? err2.code : 'خطأ غير معروف'));
        });
      } else if (err && err.code === 'auth/cancelled-popup-request') {
        /* المستخدم فتح نافذة أخرى أثناء المعالجة، تجاهل بصمت */
      } else {
        renderSignIn('تعذر تسجيل الدخول: ' + (err && err.code ? err.code : 'خطأ غير معروف'));
      }
    });
  });
}

/* ================== اختيار الاسم يدوياً (فقط إذا تعذّر التعرف التلقائي) ================== */
function renderManualNamePicker() {
  const available = PEOPLE.filter(p => !claimsByName[p]);
  app.innerHTML =
    '<h1>تقييم الرحلة 🎉</h1>' +
    '<div class="card">' +
      '<h2>من أنت؟ 👋</h2>' +
      '<p class="sub">لم نتعرّف على اسمك تلقائياً من حسابك. اختر اسمك من القائمة (الأسماء المأخوذة مسبقاً غير ظاهرة).</p>' +
      '<div class="name-grid">' +
        available.map(p => '<div class="tile name-tile"><div class="tile-inner"><button class="name-btn" data-name="' + p + '">' + p + '</button></div></div>').join('') +
      '</div>' +
      (available.length === 0 ? '<div class="error-text">كل الأسماء مُسجّلة بالفعل. إن كان أحدها اسمك، تواصل مع منظّم الرحلة.</div>' : '') +
      '<button id="signOutBtnPicker" class="link-btn">تسجيل الخروج وتجربة حساب آخر</button>' +
    '</div>' +
    resultsCardHTML();

  app.querySelectorAll('.name-btn').forEach(btn => {
    btn.addEventListener('click', () => claimName(btn.getAttribute('data-name')));
  });
  document.getElementById('signOutBtnPicker').addEventListener('click', () => auth.signOut());
  kickTileAnimations();
}

function claimName(name) {
  claimsRef.doc(name).set({
    uid: currentUser.uid,
    email: currentUser.email,
    displayName: currentUser.displayName || ''
  }).then(() => {
    myName = name;
    renderRatingForm();
  }).catch(err => {
    console.error(err);
    showToast('حدث خطأ، حاول مرة أخرى');
  });
}

/* ================== تحديد هوية المستخدم بعد تسجيل الدخول ================== */
function resolveIdentity() {
  if (claimsByUid[currentUser.uid]) {
    myName = claimsByUid[currentUser.uid];
    renderRatingForm();
    return;
  }
  const detected = detectNameFromGoogleAccount(currentUser);
  if (detected && !claimsByName[detected]) {
    claimsRef.doc(detected).set({
      uid: currentUser.uid,
      email: currentUser.email,
      displayName: currentUser.displayName || ''
    }).then(() => {
      myName = detected;
      renderRatingForm();
    }).catch(() => {
      renderManualNamePicker();
    });
  } else {
    renderManualNamePicker();
  }
}

/* ================== المرحلة 1: تقييم الرحلة/المرشد/الأشخاص ================== */
function renderRatingForm() {
  const categories = ALL_CATEGORIES.filter(c => c.key !== myName);
  const existingVotes = {};
  const existingFeedback = {};
  categories.forEach(c => {
    const votesForKey = (currentState.votes && currentState.votes[c.key]) || {};
    existingVotes[c.key] = votesForKey[currentUser.uid];
    const fbForKey = (currentState.feedback && currentState.feedback[c.key]) || {};
    existingFeedback[c.key] = fbForKey[currentUser.uid] || {};
  });

  function rowHtml(c) {
    const val = existingVotes[c.key] !== undefined ? existingVotes[c.key] : 2.5;
    const fb = existingFeedback[c.key] || {};
    return (
      '<div class="rate-row">' +
        '<label>' + c.label + '</label>' +
        '<div class="slider-wrap">' +
          '<input type="range" min="0" max="5" step="0.5" value="' + val + '" class="rate-slider" data-key="' + c.key + '" style="background:' + sliderColor(val) + '">' +
          '<div class="rate-value" data-key-val="' + c.key + '">' + fmt(val) + '</div>' +
        '</div>' +
        '<div class="range-caption"><span>0</span><span>5</span></div>' +
        (hasFeedback(c.key) ?
          '<div class="feedback-row">' +
            '<input type="text" class="text-input feedback-input" data-key="' + c.key + '" data-field="best" placeholder="✅ أفضل شيء في ' + feedbackNoun(c.key) + '" value="' + escapeAttr(fb.best || '') + '">' +
            '<input type="text" class="text-input feedback-input" data-key="' + c.key + '" data-field="worst" placeholder="❌ أسوأ شيء في ' + feedbackNoun(c.key) + '" value="' + escapeAttr(fb.worst || '') + '">' +
          '</div>'
        : '') +
      '</div>'
    );
  }

  app.innerHTML =
    '<h1>تقييم الرحلة 🎉</h1>' +
    '<div class="card">' +
      '<h2>أهلاً ' + myName + ' 🌟</h2>' +
      '<p class="sub">حرّك المؤشر لتقييم كل عنصر من 0 إلى 5 (تدعم نصف الدرجة). يمكنك تعديل تقييمك في أي وقت بإعادة الإرسال.</p>' +
      '<div id="ratingRows">' + categories.map(rowHtml).join('') + '</div>' +
      '<button id="submitBtn" class="submit-btn">التالي: الأماكن ⬅️</button>' +
      '<button id="signOutBtn" class="link-btn">تسجيل الخروج</button>' +
    '</div>' +
    resultsCardHTML() +
    '<div class="footer-note">تقييماتك سرّية ولا يراها سوى منظّم الرحلة</div>';

  const selections = Object.assign({}, existingVotes);
  categories.forEach(c => { if (selections[c.key] === undefined) selections[c.key] = 2.5; });
  const feedbackSelections = {};
  categories.forEach(c => { if (hasFeedback(c.key)) feedbackSelections[c.key] = Object.assign({ best: '', worst: '' }, existingFeedback[c.key]); });

  app.querySelectorAll('.rate-slider').forEach(slider => {
    slider.addEventListener('input', () => {
      const key = slider.getAttribute('data-key');
      const val = parseFloat(slider.value);
      selections[key] = val;
      slider.style.background = sliderColor(val);
      app.querySelector('.rate-value[data-key-val="' + key + '"]').textContent = fmt(val);
    });
  });

  app.querySelectorAll('.feedback-input').forEach(input => {
    input.addEventListener('input', () => {
      const key = input.getAttribute('data-key');
      const field = input.getAttribute('data-field');
      feedbackSelections[key][field] = input.value;
    });
  });

  document.getElementById('signOutBtn').addEventListener('click', () => auth.signOut());

  document.getElementById('submitBtn').addEventListener('click', async () => {
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'جاري الحفظ...';
    const update = {};
    categories.forEach(c => {
      update['votes.' + c.key + '.' + currentUser.uid] = selections[c.key];
      if (hasFeedback(c.key)) {
        update['feedback.' + c.key + '.' + currentUser.uid] = {
          best: (feedbackSelections[c.key].best || '').trim(),
          worst: (feedbackSelections[c.key].worst || '').trim()
        };
      }
    });
    try {
      await saveUpdate(update);
      renderPlacesForm();
    } catch (e) {
      console.error(e);
      showToast('حدث خطأ أثناء الحفظ، حاول مرة أخرى');
      btn.disabled = false;
      btn.textContent = 'التالي: الأماكن ⬅️';
    }
  });
  kickTileAnimations();
}

/* ================== المرحلة 2: الأماكن + أسئلة إضافية ================== */
function renderPlacesForm() {
  const existingPlaceVotes = {};
  PLACES.forEach(p => {
    const v = (currentState.placeVotes && currentState.placeVotes[p.key]) || {};
    existingPlaceVotes[p.key] = v[currentUser.uid];
  });
  const existingExtra = (currentState.extras && currentState.extras[currentUser.uid]) || {};

  function placeRowHtml(p) {
    const val = existingPlaceVotes[p.key] !== undefined ? existingPlaceVotes[p.key] : 2.5;
    return (
      '<div class="rate-row">' +
        '<label>' + p.label + '</label>' +
        '<div class="slider-wrap">' +
          '<input type="range" min="0" max="5" step="0.5" value="' + val + '" class="rate-slider place-slider" data-key="' + p.key + '" style="background:' + sliderColor(val) + '">' +
          '<div class="rate-value" data-key-val="' + p.key + '">' + fmt(val) + '</div>' +
        '</div>' +
        '<div class="range-caption"><span>0</span><span>5</span></div>' +
      '</div>'
    );
  }

  function gamePickerHtml(fieldName, selectedVal) {
    return '<div class="game-picker" data-field="' + fieldName + '">' +
      GAMES.map(g => '<button type="button" class="game-btn' + (selectedVal === g ? ' selected' : '') + '" data-value="' + escapeAttr(g) + '">' + g + '</button>').join('') +
      '</div>';
  }

  app.innerHTML =
    '<h1>تقييم الرحلة 🎉</h1>' +
    '<div class="card">' +
      '<h2>الأماكن 📍</h2>' +
      '<p class="sub">قيّم كل مكان زرناه من 0 إلى 5.</p>' +
      PLACES.map(placeRowHtml).join('') +
      '<div class="extra-field">' +
        '<label>🏆 ما أفضل مكان بالنسبة لك؟</label>' +
        '<input type="text" id="bestPlaceInput" class="text-input" value="' + escapeAttr(existingExtra.bestPlace || '') + '">' +
      '</div>' +
      '<div class="extra-field">' +
        '<label>👎 ما أسوأ مكان بالنسبة لك؟</label>' +
        '<input type="text" id="worstPlaceInput" class="text-input" value="' + escapeAttr(existingExtra.worstPlace || '') + '">' +
      '</div>' +
      '<div class="extra-field">' +
        '<label>🎲 ما أفضل لعبة لعبناها؟</label>' +
        gamePickerHtml('bestGame', existingExtra.bestGame || '') +
      '</div>' +
      '<div class="extra-field">' +
        '<label>🎲 ما أسوأ لعبة لعبناها؟</label>' +
        gamePickerHtml('worstGame', existingExtra.worstGame || '') +
      '</div>' +
      '<div class="extra-field">' +
        '<label>💡 ماذا كنت تحب أن يُضاف للرحلة؟</label>' +
        '<input type="text" id="wishInput" class="text-input" value="' + escapeAttr(existingExtra.wish || '') + '">' +
      '</div>' +
      '<div class="extra-field">' +
        '<label>📝 ملاحظات</label>' +
        '<textarea id="notesInput" class="text-input" rows="3">' + escapeHtml(existingExtra.notes || '') + '</textarea>' +
      '</div>' +
      '<button id="submitPlacesBtn" class="submit-btn">إرسال التقييم ✅</button>' +
      '<button id="backToRatingsBtn" class="link-btn">⬅️ الرجوع لتقييم الأشخاص</button>' +
      '<button id="signOutBtn2" class="link-btn">تسجيل الخروج</button>' +
    '</div>' +
    resultsCardHTML();

  const placeSelections = Object.assign({}, existingPlaceVotes);
  PLACES.forEach(p => { if (placeSelections[p.key] === undefined) placeSelections[p.key] = 2.5; });
  let bestGameVal = existingExtra.bestGame || '';
  let worstGameVal = existingExtra.worstGame || '';

  app.querySelectorAll('.place-slider').forEach(slider => {
    slider.addEventListener('input', () => {
      const key = slider.getAttribute('data-key');
      const val = parseFloat(slider.value);
      placeSelections[key] = val;
      slider.style.background = sliderColor(val);
      app.querySelector('.rate-value[data-key-val="' + key + '"]').textContent = fmt(val);
    });
  });

  app.querySelectorAll('.game-picker').forEach(picker => {
    const field = picker.getAttribute('data-field');
    picker.querySelectorAll('.game-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        picker.querySelectorAll('.game-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        if (field === 'bestGame') bestGameVal = btn.getAttribute('data-value');
        else worstGameVal = btn.getAttribute('data-value');
      });
    });
  });

  document.getElementById('signOutBtn2').addEventListener('click', () => auth.signOut());
  document.getElementById('backToRatingsBtn').addEventListener('click', () => renderRatingForm());

  document.getElementById('submitPlacesBtn').addEventListener('click', async () => {
    const btn = document.getElementById('submitPlacesBtn');
    btn.disabled = true;
    btn.textContent = 'جاري الحفظ...';
    const update = {};
    PLACES.forEach(p => { update['placeVotes.' + p.key + '.' + currentUser.uid] = placeSelections[p.key]; });
    update['extras.' + currentUser.uid] = {
      bestPlace: document.getElementById('bestPlaceInput').value.trim(),
      worstPlace: document.getElementById('worstPlaceInput').value.trim(),
      bestGame: bestGameVal,
      worstGame: worstGameVal,
      wish: document.getElementById('wishInput').value.trim(),
      notes: document.getElementById('notesInput').value.trim()
    };
    try {
      await saveUpdate(update);
      fireConfetti();
      renderDoneScreen();
    } catch (e) {
      console.error(e);
      showToast('حدث خطأ أثناء الحفظ، حاول مرة أخرى');
      btn.disabled = false;
      btn.textContent = 'إرسال التقييم ✅';
    }
  });
  kickTileAnimations();
}

/* ================== شاشة الشكر بعد الإرسال ================== */
function renderDoneScreen() {
  app.innerHTML =
    '<h1>تقييم الرحلة 🎉</h1>' +
    '<div class="card thankyou">' +
      '<div class="big-emoji">🎉</div>' +
      '<h2>شكراً لك ' + myName + '!</h2>' +
      '<p class="sub">تم إرسال تقييمك بنجاح. يمكنك العودة والتعديل عليه في أي وقت.</p>' +
      '<button id="editAgainBtn" class="link-btn">تعديل تقييمي</button>' +
      '<button id="signOutBtn3" class="link-btn">تسجيل الخروج</button>' +
    '</div>' +
    resultsCardHTML();
  document.getElementById('editAgainBtn').addEventListener('click', () => renderRatingForm());
  document.getElementById('signOutBtn3').addEventListener('click', () => auth.signOut());
  kickTileAnimations();
}

/* ================== تنسيق الإقلاع: الاستماع للمصادقة + البيانات ================== */
function tryStart() {
  if (!gotVotes || !gotClaims) return;
  if (!currentUser) { renderSignIn(); return; }
  resolveIdentity();
}

docRef.onSnapshot((snap) => {
  currentState = snap.data() || {};
  if (!currentState.votes) currentState.votes = {};
  if (!currentState.feedback) currentState.feedback = {};
  if (!currentState.placeVotes) currentState.placeVotes = {};
  if (!currentState.extras) currentState.extras = {};
  gotVotes = true;
  if (currentUser && myName) { refreshResultsContainer(); } else { tryStart(); }
}, (err) => {
  console.error(err);
  gotVotes = true;
  app.innerHTML = '<div class="card"><h2>تعذر الاتصال بقاعدة البيانات ⚠️</h2><p class="sub">تحقق من اتصال الإنترنت أو من صلاحيات Firestore.</p></div>';
});

claimsRef.onSnapshot((snap) => {
  claimsByName = {};
  claimsByUid = {};
  snap.forEach(doc => {
    claimsByName[doc.id] = doc.data();
    claimsByUid[doc.data().uid] = doc.id;
  });
  gotClaims = true;
  if (currentUser && myName) { refreshResultsContainer(); } else { tryStart(); }
}, (err) => { console.error(err); gotClaims = true; tryStart(); });

auth.getRedirectResult().catch((err) => {
  console.error('redirect result error', err);
  renderSignIn('تعذر تسجيل الدخول: ' + (err && err.code ? err.code : 'خطأ غير معروف'));
});

auth.onAuthStateChanged((user) => {
  currentUser = user;
  myName = null;
  tryStart();
});
</script>
